name: Android APK build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug and release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle
            **/*.gradle.kts
            **/gradle-wrapper.properties
            gradle/libs.versions.toml

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
          test -d "$ANDROID_HOME/platforms/android-37.0" || { echo "Android SDK Platform 37.0 was not installed"; exit 1; }
          test -d "$ANDROID_HOME/build-tools/37.0.0" || { echo "Android Build Tools 37.0.0 were not installed"; exit 1; }

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: square-android-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
          
