# 4g was enough to build but left R8 and the Kotlin compiler collecting garbage
# for a good part of their run.
org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Keep the existing Kotlin Gradle plugins during the AGP 9.x transition.
android.builtInKotlin=false
android.newDsl=false
